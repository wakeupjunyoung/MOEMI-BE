spring.application.name=moemi

# Personal settings (DB account, API keys) in a git-ignored file next to build.gradle.
# Values there override the defaults below; environment variables keep working as before.
spring.config.import=optional:file:./application-local.properties

# Database (override with environment variables; never commit real credentials)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/moemi?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# KMA living weather index API (data.go.kr). Use the "Decoding" service key.
moemi.kma.service-key=${KMA_SERVICE_KEY:}

# National Transport Information Center (its.go.kr) incident API
moemi.its.api-key=${ITS_API_KEY:}

# TAGO bus stop/route/arrival/location APIs (data.go.kr). Either the Encoding or the Decoding key works.
moemi.tago.service-key=${TAGO_SERVICE_KEY:}
# First supported city (24 = Gwangju); used when a request has no cityCode.
moemi.tago.default-city-code=${TAGO_DEFAULT_CITY_CODE:24}
