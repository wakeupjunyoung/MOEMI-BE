spring.application.name=moemi

# Database (override with environment variables; never commit real credentials)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/moemi?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# KMA living weather index API (data.go.kr). Use the "Decoding" service key.
moemi.kma.service-key=${KMA_SERVICE_KEY:}

# National Transport Information Center (its.go.kr) incident API
moemi.its.api-key=${ITS_API_KEY:}
